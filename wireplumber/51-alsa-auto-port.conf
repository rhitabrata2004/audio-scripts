# Enable real ALSA port switching for the built-in PCH audio card.
#
# Without this, "auto-port" defaults to false (see
# /usr/share/wireplumber/scripts/monitors/alsa.lua), which means
# WirePlumber updates the *reported* Active Port on jack plug/unplug
# but never actually invokes the underlying ALSA path switch. Since
# each ACP mixer path (analog-output-speaker.conf /
# analog-output-headphones.conf) carries its own cross-mute directive
# (e.g. the headphones path sets [Element Speaker] switch=off), that
# mute only takes effect once the path switch actually runs. With
# auto-port disabled, it never does, so both Speaker and Headphone
# outputs stay unmuted at the same time when headphones are plugged in.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        api.acp.auto-port = true
      }
    }
  }
]
